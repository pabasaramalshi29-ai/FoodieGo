<div class="absolute -top-24 right-1/2 translate-x-1/2 w-72 h-72 rounded-full bg-primary-fixed/25 blur-3xl pointer-events-none -z-10"></div>

<span class="font-label-sm text-label-sm tracking-wide">Fast &amp; Fresh</span>
</div>
</div>
<!-- Brand Identity Showcase -->
<div class="flex flex-col items-center mt-3 mb-5">
<div class="relative group">
<div class="w-20 h-20 rounded-[22px] bg-gradient-to-tr from-primary-container to-[#ff8038] shadow-lg shadow-primary-container/25 flex items-center justify-center overflow-hidden p-3.5">

</div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center">
<span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
</div>
</div>
<!-- Title & Welcoming Message -->
<div class="text-center mt-4 space-y-1">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight flex items-center justify-center gap-1.5">
        Welcome Back! <span class="inline-block hover:rotate-12 transition-transform origin-bottom-right">👋</span>
</h1>
<p class="font-body-md text-body-md text-secondary max-w-xs">
        Sign in to continue ordering tasty meals
      </p>
</div>
</div>
<!-- Login Form Container -->
<form class="w-full flex flex-col space-y-4" id="loginForm" onsubmit="event.preventDefault(); triggerLogin();">
<!-- Email Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="emailInput">
<span>Email Address</span>
</label>
<div class="relative flex items-center group">
<div class="absolute left-4 flex items-center pointer-events-none text-secondary group-focus-within:text-primary-container transition-colors">
<span class="material-symbols-outlined text-[20px]">alternate_email</span>
</div>
<input class="w-full h-[54px] pl-12 pr-4 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-secondary-fixed-dim/80" id="emailInput" placeholder="alex.rider@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant" for="passwordInput">
          Password
        </label>
<button class="font-label-sm text-label-sm text-primary-container hover:underline focus:outline-none active:opacity-75" type="button">
          Forgot Password?
        </button>
</div>
<div class="relative flex items-center group">
<div class="absolute left-4 flex items-center pointer-events-none text-secondary group-focus-within:text-primary-container transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-[54px] pl-12 pr-12 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-secondary-fixed-dim/80 tracking-wider" id="passwordInput" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 flex items-center justify-center w-10 h-10 rounded-full text-secondary hover:text-on-surface active:scale-90 transition-transform focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Stay Logged in Micro-Control -->
<div class="flex items-center pt-0.5 pb-1">
<label class="flex items-center space-x-2.5 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary-container accent-primary-container focus:ring-0 cursor-pointer" type="checkbox"/>
<span class="font-body-sm text-body-sm text-secondary">Remember me on this phone</span>
</label>
</div>
<!-- Primary Login Button -->
<button class="w-full h-[54px] mt-1 bg-gradient-to-r from-primary-container to-[#ff7a29] text-on-primary font-headline-sm text-headline-sm rounded-2xl shadow-lg shadow-primary-container/30 active:scale-[0.98] transition-all flex items-center justify-center space-x-2" id="submitButton" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
</form>
<!-- Divider Section -->
<div class="flex items-center my-6 space-x-3">
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary px-1">Or continue with</span>
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
</div>
<!-- Social Authentication Providers -->
<div class="grid grid-cols-3 gap-3 w-full">
<!-- Google Button -->
<button aria-label="Log in with Google" class="h-[52px] bg-surface-container-lowest rounded-2xl shadow-sm flex items-center justify-center hover:bg-surface-container-low active:scale-95 transition-all group" type="button">
<svg class="w-5 h-5 transition-transform group-hover:scale-110" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
</button>
<!-- Apple Button -->
<button aria-label="Log in with Apple" class="h-[52px] bg-surface-container-lowest rounded-2xl shadow-sm flex items-center justify-center hover:bg-surface-container-low active:scale-95 transition-all group" type="button">
<svg class="w-5 h-5 fill-on-surface transition-transform group-hover:scale-110" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.66-.8 1.11-1.92.99-3.04-.96.04-2.12.64-2.8 1.44-.6.69-1.12 1.83-.98 2.92 1.07.08 2.15-.55 2.79-1.32z"></path>
</svg>
</button>
<!-- Facebook Button -->
<button aria-label="Log in with Facebook" class="h-[52px] bg-surface-container-lowest rounded-2xl shadow-sm flex items-center justify-center hover:bg-surface-container-low active:scale-95 transition-all group" type="button">
<svg class="w-5 h-5 fill-[#1877F2] transition-transform group-hover:scale-110" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
</button>
</div>
<!-- Sign Up Footer Promotion -->
<div class="mt-8 mb-2 text-center">
<p class="font-body-md text-body-md text-secondary">
      Don't have an account? 
      <a class="font-headline-sm text-label-lg text-primary-container hover:underline ml-1 inline-flex items-center" href="#signup">
        Sign Up
      </a>
</p>
</div>
</div>
<script>
  // Simple micro-interaction scripts for password reveal and button feedback
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('passwordInput');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  function triggerLogin() {
    const btn = document.getElementById('submitButton');
    if (!btn) return;
    const originalText = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Signing In...</span>`;
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.disabled = false;
    }, 1200);
  }
</script></main></body></html>
