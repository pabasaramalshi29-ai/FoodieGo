    </p>
</div>

<form class="flex flex-col gap-space-md" id="signup-form" onsubmit="event.preventDefault();">

<span>Full Name</span>
<span class="font-label-sm text-label-sm text-secondary">Required</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-secondary pointer-events-none text-title-md">
          person
        </span>
<input class="w-full h-[52px] pl-12 pr-4 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none focus:bg-surface-container-low transition-all placeholder:text-secondary-fixed-dim" id="full-name" placeholder="e.g. Alex Rider" type="text" value="Alex Rider"/>
</div>
</div>

<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="email">

        </span>
<input class="w-full h-[52px] pl-12 pr-4 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none focus:bg-surface-container-low transition-all placeholder:text-secondary-fixed-dim" id="email" placeholder="name@example.com" type="email" value="alex.rider@example.com"/>
</div>
</div>

</div>
</div>

</button>
</div>
<!-- Password Strength Meter Delight -->
<div class="flex items-center gap-1.5 mt-1 px-1">
<div class="h-1.5 flex-1 rounded-full bg-primary-container"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary-container"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary-container"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary-container"></div>
<span class="material-symbols-outlined text-primary-container text-body-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>

</div>
</div>
<span class="font-body-sm text-body-sm text-secondary leading-snug">

<span>Create Account</span>
<span class="material-symbols-outlined text-title-md transition-transform group-hover:translate-x-1">arrow_forward</span>

<div class="flex items-center justify-center gap-2 py-2 px-3 rounded-full bg-surface-container text-on-surface-variant self-center shadow-sm">
<span class="material-symbols-outlined text-tertiary-container text-title-md" style="font-variation-settings: 'FILL' 1;">redeem</span>
<span class="font-label-sm text-label-sm">Includes <strong>Free Delivery</strong> on your first 3 orders</span>
</div>

<div class="grow h-px bg-surface-container-highest"></div>

<div class="grid grid-cols-2 gap-space-sm">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>

<button class="h-12 rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-center gap-2 font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors" type="button">

<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.92.04-2.02.62-2.67 1.37-.56.64-.98 1.69-.85 2.72 1.03.08 2.02-.54 2.6-1.22z"></path>
</svg>
<span>Apple</span>
</button>
</div>
<!-- Screen Footer / Existing Member Callout -->
<footer class="mt-space-lg text-center pb-safe">
<p class="font-body-md text-body-md text-secondary">
      Already have an account? 
      <a class="font-title-md text-title-md text-primary-container font-bold hover:underline inline-flex items-center gap-0.5 ml-1" href="#">
        Log In
        <span class="material-symbols-outlined text-[16px]">chevron_right</span>
</a>
</p>
</footer>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-pwd');
    const pwdInput = document.getElementById('password');
    const pwdIcon = document.getElementById('pwd-icon');

    if (toggleBtn && pwdInput && pwdIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
